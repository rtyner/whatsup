name: Update event calendar (fallback)

# Manual only. The daily refresh runs on a local machine via scripts/daily.sh,
# because Eventbrite answers GitHub's datacenter IPs with HTTP 405 — a run from
# here can only carry over the Eventbrite listings from the last local run.
# Useful if the local machine is down for long enough that the other sources
# would otherwise go stale too.
on:
  workflow_dispatch:

concurrency:
  group: update-events
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          GEOCODER_CONTACT: https://github.com/${{ github.repository }}
        run: node scripts/fetch.mjs

      - name: Commit refreshed data
        run: |
          git config user.name  "whatsup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/geocache.json
          if git diff --cached --quiet; then
            echo "No change in event data."
          else
            git commit -m "data: refresh events for $(date -u +%Y-%m-%d)"
            git push
          fi

  # A push made with GITHUB_TOKEN does not trigger other workflows, so this job
  # publishes the freshly committed data itself.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
